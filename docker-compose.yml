services:
  xray:
    image: ghcr.io/xtls/xray-core:26.10.21
    container_name: lan-vpn-proxy
    restart: unless-stopped
    # Свой uid, чтобы xray мог читать config.json с правами 600.
    user: "${PUID:-1000}:${PGID:-1000}"
    # Сеть хоста: Xray сам слушает BIND_ADDR, SOCKS_PORT и HTTP_PORT из .env (gen_config.py
    # пишет их в конфиг) и видит настоящий порт программы — по нему web.py узнаёт приложение.
    network_mode: host
    # Правила по приложениям (VPN_APPS): Xray ищет процесс соединения в /proc хоста. Для этого
    # нужно видеть процессы хоста, а профиль AppArmor docker-default не даёт читать их /proc/<pid>/fd.
    pid: host
    security_opt:
      - apparmor=unconfined
    # Прозрачный прокси (TPROXY_PORT) открывает сокет с IP_TRANSPARENT — нужен NET_ADMIN. Право
    # действует, только если Xray работает от root (PUID=0); с обычным PUID оно ни на что не влияет.
    cap_add:
      - NET_ADMIN
    # Не в /usr/local/etc/xray, как по умолчанию в образе: с 26.10.21 /usr/local/etc закрыт
    # правами 750 root:65532, и Xray с нашим PUID туда не заходит.
    volumes:
      - ./xray:/config:ro
    command: ["run", "-c", "/config/config.json"]
    # Журнал подключений web.py раз в минуту переносит в data/hosts.json, поэтому
    # держать его целиком незачем.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
