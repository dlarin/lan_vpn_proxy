services:
  xray:
    image: ghcr.io/xtls/xray-core:26.7.28
    container_name: lan-vpn-proxy
    restart: unless-stopped
    # Свой uid, чтобы xray мог читать config.json с правами 600.
    user: "${PUID:-1000}:${PGID:-1000}"
    # Сеть хоста: Xray сам слушает BIND_ADDR, SOCKS_PORT и HTTP_PORT из .env (gen_config.py
    # пишет их в конфиг) и видит настоящий порт программы — по нему web.py узнаёт приложение.
    network_mode: host
    # Правила по приложениям (VPN_APPS): Xray ищет процесс соединения в /proc хоста. Для этого
    # нужно видеть процессы хоста, а профиль AppArmor docker-default не даёт читать их /proc/<pid>/fd.
    pid: host
    security_opt:
      - apparmor=unconfined
    volumes:
      - ./xray:/usr/local/etc/xray:ro
    # Журнал подключений web.py раз в минуту переносит в data/hosts.json, поэтому
    # держать его целиком незачем.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
